name: Container smoke (manual)
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [linux/amd64, linux/arm64]
        default: linux/arm64
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: ${{ inputs.platform }}
          tags: aite-echo:smoke
      - name: Check only the test container
        env:
          IMAGE: aite-echo:smoke
          PLATFORM: ${{ inputs.platform }}
        run: bash scripts/smoke-arm64-image.sh
