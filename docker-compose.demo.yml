services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    environment:
      WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:?Set a private NAPCAT_WEBUI_TOKEN in .env}
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - ./deploy/napcat.onebot11.reverse-ws.json:/app/napcat/config/onebot11.json:ro
      - ./napcat/QQ:/app/.config/QQ
  aite-echo:
    build: .
    image: aite-echo:local
    restart: unless-stopped
    env_file:
      - ./.env.docker
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./data:/app/data
      - ./examples/group-rules.local.json:/app/examples/group-rules.local.json:ro
